<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1c20">
  <meta name="description" content="Fishrod'a karşı satranç oyna: Rust ile sıfırdan yazılmış bir satranç motoru, doğrudan tarayıcında.">
  <title>Fishrod</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Fishrod">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="img/logo-96.png" alt="" width="32" height="32">
      <span class="brand-name">Fishrod</span>
    </div>
    <button type="button" class="button button-ghost" id="new-game-top">Yeni oyun</button>
  </header>

  <main class="layout">
    <section class="play" aria-label="Oyun">
      <div class="player" id="player-top">
        <div class="player-name"><span class="name"></span><span class="tag"></span></div>
        <div class="player-side"><span class="captured"></span><span class="thinking" hidden>düşünüyor</span></div>
      </div>

      <div class="board-frame">
        <div class="board" id="board" role="grid" aria-label="Satranç tahtası"></div>
        <svg class="marks" id="marks" viewBox="0 0 8 8" aria-hidden="true"></svg>
        <div class="promotion" id="promotion" hidden></div>
      </div>

      <div class="player" id="player-bottom">
        <div class="player-name"><span class="name"></span><span class="tag"></span></div>
        <div class="player-side"><span class="captured"></span><span class="thinking" hidden>düşünüyor</span></div>
      </div>
    </section>

    <aside class="panel" aria-label="Oyun bilgileri">
      <p class="status" id="status" role="status" aria-live="polite">Motor yükleniyor…</p>

      <ol class="moves" id="moves" aria-label="Hamleler"></ol>

      <div class="actions">
        <button type="button" class="button" id="take-back">Geri al</button>
        <button type="button" class="button" id="flip">Tahtayı çevir</button>
        <button type="button" class="button" id="resign">Teslim ol</button>
      </div>
      <div class="actions actions-main">
        <button type="button" class="button button-primary" id="new-game">Yeni oyun</button>
        <button type="button" class="button" id="copy-pgn">PGN'yi kopyala</button>
      </div>
    </aside>
  </main>

  <footer class="footer">
    <p>Fishrod, Rust ile sıfırdan yazılmış bir satranç motoru; bu sayfada tamamen tarayıcında çalışır.</p>
    <p>Taş çizimleri: Colin M.L. Burnett, Wikimedia Commons (GPL / BSD / GFDL).</p>
  </footer>

  <dialog class="dialog" id="new-game-dialog" aria-labelledby="new-game-title">
    <form method="dialog" id="new-game-form">
      <h2 id="new-game-title">Yeni oyun</h2>

      <fieldset class="field">
        <legend>Renk</legend>
        <div class="segmented">
          <label><input type="radio" name="color" value="w" checked><span>Beyaz</span></label>
          <label><input type="radio" name="color" value="random"><span>Rastgele</span></label>
          <label><input type="radio" name="color" value="b"><span>Siyah</span></label>
        </div>
      </fieldset>

      <fieldset class="field">
        <legend>Seviye</legend>
        <div class="levels" id="levels"></div>
      </fieldset>

      <div class="dialog-actions">
        <button type="submit" class="button" value="cancel">Vazgeç</button>
        <button type="submit" class="button button-primary" value="start">Başla</button>
      </div>
    </form>
  </dialog>

  <dialog class="dialog dialog-small" id="result-dialog" aria-labelledby="result-title">
    <form method="dialog">
      <h2 id="result-title"></h2>
      <p id="result-text"></p>
      <div class="dialog-actions">
        <button type="submit" class="button" value="close">Tahtaya dön</button>
        <button type="submit" class="button" value="pgn">PGN'yi kopyala</button>
        <button type="submit" class="button button-primary" value="new">Yeni oyun</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
