# Builds the release binaries of the engine.
#
# Pushing a version tag such as v0.1.0 builds the engine for Windows and
# Linux, runs the tests and prepares a draft release with both binaries; the
# draft is published by hand on the releases page. Run by hand, the workflow
# only builds and tests, which checks it without publishing anything.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86-64
            extension: .exe
            # A static C runtime, so that the binary needs no extra DLLs.
            rustflags: -C target-feature=+crt-static
          - os: ubuntu-latest
            # musl links statically, so the binary runs on any distribution.
            target: x86_64-unknown-linux-musl
            platform: linux-x86-64
            extension: ''
            rustflags: ''
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: grep -q "^version = \"${GITHUB_REF_NAME#v}\"$" Cargo.toml

      - name: Install the target
        run: rustup target add ${{ matrix.target }}

      - name: Test
        run: cargo test --release --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Bench
        run: target/${{ matrix.target }}/release/fishrod${{ matrix.extension }} bench

      - name: Name the binary
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/fishrod${{ matrix.extension }} \
            "dist/fishrod-${GITHUB_REF_NAME#v}-${{ matrix.platform }}${{ matrix.extension }}"

      - uses: actions/upload-artifact@v4
        with:
          name: fishrod-${{ matrix.platform }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prepare a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Fishrod ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --draft
